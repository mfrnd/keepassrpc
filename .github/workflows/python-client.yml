# CI for the Python client: lint, types and tests, on both platforms it runs on.
# The C# plugin is not built here because `codeql` already builds it, provisions the
# KeePass it references, and analyses the result.
name: python-client

on:
  # Push on master only, so a branch with a pull request open is not checked twice for
  # every commit. Pull requests against any base, because work here lands as stacked
  # branches whose base is routinely another feature branch.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# No path filters. These checks are required for a merge, and a required check that is
# filtered away never reports, which blocks the pull request it was meant to clear rather
# than clearing it. A run on a change that touches nothing here costs about a minute and
# removes that whole failure mode.

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/python

jobs:
  check:
    # Windows because that is where the client actually runs, against a Windows-only
    # plugin; Linux because it catches the platform assumptions that Windows hides.
    # The DPAPI tests skip themselves off Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact version, unlike every other action here, because this one
        # stopped publishing a floating major tag after v6: `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock

      - name: Install dependencies
        # --locked, so CI fails on an out-of-date lockfile rather than quietly
        # resolving something different from what was tested locally.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
