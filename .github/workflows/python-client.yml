# CI for the Python client only. The C# plugin is deliberately not built here: it
# references KeePass.exe from a developer's own KeePassDEV directory, which no hosted
# runner has, and inventing a download step for it would be a change to how the fork
# builds rather than a check on it.
name: python-client

on:
  push:
    paths:
      - 'clients/python/**'
      - '.github/workflows/python-client.yml'
  pull_request:
    paths:
      - 'clients/python/**'
      - '.github/workflows/python-client.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/python

jobs:
  check:
    # Windows because that is where the client actually runs, against a Windows-only
    # plugin; Linux because it catches the platform assumptions that Windows hides.
    # The DPAPI tests skip themselves off Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: clients/python/uv.lock

      - name: Install dependencies
        # --locked, so CI fails on an out-of-date lockfile rather than quietly
        # resolving something different from what was tested locally.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
