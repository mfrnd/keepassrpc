# Builds the .plgx and publishes it as a release asset when a v* tag is pushed.
#
# The Python CI deliberately does not build the C# plugin because a hosted runner
# has no KeePass.exe to reference. A release is the one place that cost is worth
# paying: the plugin references KeePass through $(USERPROFILE)\KeePassDEV\KeePass.exe
# and invokes that same exe for --plgx-create, so this job provisions a portable
# KeePass into that directory before it builds. It also lays down the .NET
# Framework 4.5 targeting pack, which the project targets and a bare runner lacks.
#
# The .plgx is a source package that KeePass recompiles on load, so a green build
# here is necessary but not sufficient: the packaged file list has to be complete
# as well. That is checked at build time by the post-build's fail-closed copies
# and at load time on a user's machine; there is no compile of the package here.
name: release

on:
  push:
    tags:
      - 'v*'
  # Lets the build be exercised without cutting a release: on a manual run the
  # .plgx is uploaded as a workflow artifact instead of to a GitHub release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # The version of the portable KeePass the plugin builds against. It only has
      # to be at least the --plgx-prereq-kp floor the post-build stamps in (2.48);
      # a newer one packages an older-floored plugin without complaint.
      KEEPASS_VERSION: '2.57'

    steps:
      - uses: actions/checkout@v4

      - name: Provision KeePass into KeePassDEV
        shell: pwsh
        run: |
          $dev = Join-Path $env:USERPROFILE 'KeePassDEV'
          New-Item -ItemType Directory -Force -Path $dev | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'keepass.zip'
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dev -Force
          if (-not (Test-Path (Join-Path $dev 'KeePass.exe'))) {
            throw "KeePass.exe not found under $dev after extraction"
          }

      - name: Install the .NET Framework 4.5 targeting pack
        # The 4.5.2 developer pack carries the 4.5, 4.5.1 and 4.5.2 reference
        # assemblies, so it satisfies a project that targets v4.5 exactly.
        shell: pwsh
        run: choco install netfx-4.5.2-devpack -y --no-progress

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build the .plgx
        shell: pwsh
        # The project, not the solution: the solution maps ReleasePLGX for this
        # project to a stray configuration and would build the wrong thing.
        run: msbuild KeePassRPC\KeePassRPC.csproj /p:Configuration=ReleasePLGX /v:minimal /nologo

      - name: Locate the .plgx and record its hash
        id: plgx
        shell: pwsh
        run: |
          $plgx = Join-Path $env:USERPROFILE 'KeePassDEV\plugins\KeePassRPC.plgx'
          if (-not (Test-Path $plgx)) { throw "Build did not produce $plgx" }
          $staged = Join-Path $env:GITHUB_WORKSPACE 'KeePassRPC.plgx'
          Copy-Item $plgx $staged -Force
          $hash = (Get-FileHash $staged -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "path=$staged"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KeePassRPC.plgx
          path: ${{ steps.plgx.outputs.path }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.plgx.outputs.path }}
          # The scoop manifest pins this exact digest; surfacing it in the notes
          # saves fishing it back out of the asset.
          body: |
            `KeePassRPC.plgx` SHA256: `${{ steps.plgx.outputs.sha256 }}`
