# Builds the .plgx and publishes it as a release asset when a v* tag is pushed.
#
# The plugin references KeePass through $(USERPROFILE)\KeePassDEV\KeePass.exe and drives
# that same exe for --plgx-create, so the build needs a KeePass provisioned on the runner.
# The `setup-keepass-build` composite action does that and supplies the .NET Framework 4.5
# reference assemblies; the CodeQL C# analysis uses the same action, so the recipe has one
# home rather than two copies that drift.
#
# The .plgx is a source package that KeePass recompiles on load, so a green build
# here is necessary but not sufficient: the packaged file list has to be complete
# as well. That is checked at build time by the post-build's fail-closed copies
# and at load time on a user's machine; there is no compile of the package here.
name: release

on:
  push:
    tags:
      - 'v*'
  # Lets the build be exercised without cutting a release: on a manual run the
  # .plgx is uploaded as a workflow artifact instead of to a GitHub release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up the plugin build
        uses: ./.github/actions/setup-keepass-build

      - name: Build the .plgx
        shell: pwsh
        # The project, not the solution: the solution maps ReleasePLGX for this
        # project to a stray configuration and would build the wrong thing.
        run: msbuild KeePassRPC\KeePassRPC.csproj /p:Configuration=ReleasePLGX /v:minimal /nologo

      - name: Locate the .plgx and record its hash
        id: plgx
        shell: pwsh
        run: |
          $plgx = Join-Path $env:USERPROFILE 'KeePassDEV\plugins\KeePassRPC.plgx'
          if (-not (Test-Path $plgx)) { throw "Build did not produce $plgx" }
          $staged = Join-Path $env:GITHUB_WORKSPACE 'KeePassRPC.plgx'
          Copy-Item $plgx $staged -Force
          $hash = (Get-FileHash $staged -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $hash"
          "path=$staged"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: KeePassRPC.plgx
          path: ${{ steps.plgx.outputs.path }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.plgx.outputs.path }}
          # The scoop manifest pins this exact digest; surfacing it in the notes
          # saves fishing it back out of the asset.
          body: |
            `KeePassRPC.plgx` SHA256: `${{ steps.plgx.outputs.sha256 }}`
