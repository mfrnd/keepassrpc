# Everything a hosted Windows runner needs before it can build this plugin.
#
# The plugin references KeePass through $(USERPROFILE)\KeePassDEV\KeePass.exe and invokes
# that same exe to package a .plgx, and it targets .NET Framework 4.5, whose reference
# assemblies a bare runner does not carry. Both the release build and the CodeQL C#
# analysis need exactly this, so the recipe lives in one place rather than drifting
# between two workflows.
name: Set up the KeePass plugin build
description: Provisions a portable KeePass, the .NET Framework 4.5 targeting pack and MSBuild.

inputs:
  keepass-version:
    description: >
      Version of the portable KeePass to build against. It only has to meet the
      --plgx-prereq-kp floor the post-build stamps in; a newer one packages an
      older-floored plugin without complaint. The default is the version the plugin
      is developed and load-tested against.
    required: false
    default: '2.61.1'

runs:
  using: composite
  steps:
    - name: Provision KeePass into KeePassDEV
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $dev = Join-Path $env:USERPROFILE 'KeePassDEV'
        New-Item -ItemType Directory -Force -Path $dev | Out-Null
        $version = '${{ inputs.keepass-version }}'
        $zip = Join-Path $env:RUNNER_TEMP 'keepass.zip'
        # use_mirror=autoselect, because without it SourceForge answers the plain download
        # URL with its mirror-picker page: HTTP 200, an HTML body, and an unzip failure
        # several steps later that reads like a corrupt archive rather than a wrong URL.
        $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$version/KeePass-$version.zip?use_mirror=autoselect"

        $attempt = 0
        while ($true) {
          $attempt++
          try {
            Write-Host "Downloading KeePass $version (attempt $attempt)"
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -UserAgent 'Wget/1.21'
            # Check the magic bytes rather than trusting the status code, so an interstitial
            # or a mirror error page fails here with a clear reason.
            $head = [System.IO.File]::ReadAllBytes($zip)[0..1]
            if ([System.Text.Encoding]::ASCII.GetString($head) -ne 'PK') {
              throw "downloaded file is not a zip (got $((Get-Item $zip).Length) bytes of something else)"
            }
            break
          } catch {
            if ($attempt -ge 3) { throw "KeePass $version download failed: $($_.Exception.Message)" }
            Write-Host "  retrying: $($_.Exception.Message)"
            Start-Sleep -Seconds (5 * $attempt)
          }
        }

        Expand-Archive -Path $zip -DestinationPath $dev -Force
        $exe = Join-Path $dev 'KeePass.exe'
        if (-not (Test-Path $exe)) { throw "KeePass.exe not found under $dev after extraction" }
        Write-Host "KeePass $((Get-Item $exe).VersionInfo.FileVersion) ready at $dev"

    - name: Install the .NET Framework 4.5 targeting pack
      # The 4.5.2 developer pack carries the 4.5, 4.5.1 and 4.5.2 reference assemblies,
      # so it satisfies a project that targets v4.5 exactly.
      shell: pwsh
      run: choco install netfx-4.5.2-devpack -y --no-progress

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2
