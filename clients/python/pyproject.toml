[project]
name = 'keepassrpc-client'
version = '0.1.0'
description = 'Python client for the KeePassRPC plugin protocol: SRP pairing, key-challenge reconnect and encrypted JSON-RPC.'
requires-python = '>=3.11'
license = { text = 'GPL-2.0-or-later' }
dependencies = [
    'websocket-client>=1.7',
    'cryptography>=42',
]

[dependency-groups]
dev = [
    'pytest>=8',
    'pytest-cov>=5',
    'ruff>=0.6,<0.16',  # match the repo's other projects (0.15.x); 0.16 flips lint defaults
    'mypy>=1.10',
]

[project.scripts]
keepassrpc-client = 'keepassrpc_client.cli:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['keepassrpc_client']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
addopts = '--cov --cov-report=term-missing --cov-fail-under=80'

[tool.coverage.run]
source = ['keepassrpc_client']
# cli.py's main() is an argparse shell over the library; the parser and the command
# functions are tested, the __main__ entry point is not worth a fake process.
omit = ['*/__main__.py']

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
# Beyond ruff's defaults (E4, E7, E9, F): import order, bugbear, pyupgrade, simplify,
# and ruff's own checks. Deliberately not the full firehose. These are the rule sets
# that catch real defects rather than argue about style.
select = ['E', 'F', 'W', 'I', 'B', 'UP', 'SIM', 'RUF']

[tool.mypy]
# Includes the tests, not just the library. They were outside the checked set until
# 2026-08-12, which meant CI stayed green over a dozen type errors in them, and the
# tests are where the protocol's shapes are asserted, so they are worth checking.
files = ['keepassrpc_client', 'tests']
python_version = '3.11'
# Pin the platform rather than inheriting the one mypy happens to run on: keystore.py's
# DPAPI path is Windows-only (ctypes.windll, wintypes) and the checks run from both a
# Windows shell and Linux CI. Without this the same code is either an error or an unused
# `type: ignore` depending on where mypy was started.
platform = 'win32'
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ['websocket.*']
ignore_missing_imports = true
